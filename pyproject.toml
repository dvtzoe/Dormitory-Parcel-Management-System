[project]
name = "dormitory-parcel-management-system"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.uv.build-backend]
module-root = ""
module-name = ["apps.server.src.server", "apps.tui.src.tui"]

[tool.uv.workspace]
members = [
    "apps/*",
    "packages/*",
]

[tool.basedpyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
extend-exclude = ["typings"]

[project.scripts]
dpms = "tui.main:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14"]
build-backend = "uv_build"
